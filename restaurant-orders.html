<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B19;
    --marigold:#E8A33D;
    --chili:#C1432E;
    --leaf:#3F6B4F;
    --cloud:#F7F3EA;
    --muted:#B8B0A2;
    --muted-2:#6E695F;
    --field-bg:#25231F;
    --field-border:#3A3733;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ink); font-family:'Inter',sans-serif; display:flex; justify-content:center; min-height:100vh; }
  #app{ width:100%; max-width:420px; min-height:100vh; background:var(--ink); position:relative; }
  .screen{ display:none; padding-bottom:24px; }
  .screen.active{ display:block; }

  .top-row{ padding:32px 24px 8px; display:flex; align-items:center; gap:12px; }
  .btn-back{ background:none; border:none; color:var(--marigold); cursor:pointer; padding:0; display:flex; }
  .eyebrow{ color:var(--marigold); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; margin:0; }
  .title{ color:var(--cloud); font-family:'Fraunces',serif; font-size:24px; font-weight:700; margin:2px 0 0; }

  .order-list{ padding:20px 24px 40px; display:flex; flex-direction:column; gap:12px; }
  .chit{ background:var(--cloud); border-radius:10px; padding:14px; cursor:pointer; border:none; width:100%; text-align:left; font-family:'Inter',sans-serif; }
  .order-top{ display:flex; align-items:center; justify-content:space-between; }
  .order-num{ color:var(--ink); font-weight:700; font-family:'IBM Plex Mono',monospace; font-size:14px; margin:0; }
  .order-time{ color:#5C574C; font-size:11px; margin:2px 0 0; }
  .order-mid{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .order-cust{ color:#3a3733; font-size:13px; margin:0; }
  .order-total{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; margin:0; }

  .pill{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
    font-family:'IBM Plex Mono',monospace; letter-spacing:0.5px; text-transform:uppercase;
  }
  .pill-pending{ background:#F3D9AE; color:#8A5A0F; }
  .pill-preparing{ background:#CFE0D6; color:#2C4A37; }
  .pill-ready{ background:#BFE3F0; color:#1C5A70; }
  .pill-delivered{ background:#D6D0C4; color:#4A463D; }
  .pill-cancelled{ background:#EFC3BA; color:#7A2A1D; }

  .empty-text{ color:var(--muted-2); font-size:14px; padding:0 24px; }

  /* Detail screen */
  .detail-header{ padding:32px 24px 0; }
  .detail-block{ margin:24px 24px 0; background:var(--cloud); border-radius:12px; padding:18px; }
  .detail-label{ color:#5C574C; font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:1px; margin:0 0 4px; text-transform:uppercase; }
  .detail-value{ color:var(--ink); font-size:14px; margin:0 0 14px; }
  .detail-value:last-child{ margin-bottom:0; }
  .detail-phone-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--leaf) !important;
    text-decoration:none; font-weight:700;
  }
  .detail-phone-link::before{
    content:"📞"; font-size:13px;
  }
  .item-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink); padding:4px 0; }
  .item-row-total{ border-top:1px dashed var(--ink); margin-top:8px; padding-top:8px; font-weight:700; }

  .status-actions{ padding:20px 24px 0; display:flex; flex-direction:column; gap:10px; }
  .status-btn{
    width:100%; padding:14px; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .status-btn.preparing{ background:var(--leaf); color:var(--cloud); }
  .status-btn.ready{ background:#3A8FB0; color:var(--cloud); }
  .status-btn.delivered{ background:var(--marigold); color:var(--ink); }
  .status-btn.cancel{ background:transparent; border:1.5px solid var(--chili); color:var(--chili); }

  .detail-map-btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
    border:1.5px solid var(--leaf); background:transparent; color:var(--leaf);
    font-weight:600; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif;
  }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:999;
    background:var(--leaf); color:var(--cloud); padding:14px 18px; border-radius:10px;
    font-size:14px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:380px; width:calc(100% - 32px);
    display:none; text-align:center;
  }
  .toast.show{ display:block; }

  /* Swiggy-style new order popup */
  .order-popup-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2000;
    display:none; align-items:flex-end; justify-content:center;
  }
  .order-popup-overlay.show{ display:flex; }
  .order-popup{
    width:100%; max-width:420px; max-height:85vh; background:var(--cloud); border-radius:20px 20px 0 0;
    padding:24px; animation:popupUp .25s ease-out; display:flex; flex-direction:column;
  }
  @keyframes popupUp{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .order-popup-ring{
    width:56px; height:56px; border-radius:50%; background:var(--chili); display:flex;
    align-items:center; justify-content:center; margin:0 auto 12px; animation:ringPulse 1s infinite; flex-shrink:0;
  }
  @keyframes ringPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .order-popup-eyebrow{ color:var(--chili); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; text-align:center; margin:0 0 4px; font-weight:700; flex-shrink:0; }
  .order-popup-list{ overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  .order-popup-card + .order-popup-card{ border-top:1px dashed var(--muted); padding-top:14px; }
  .order-popup-title{ color:var(--ink); font-family:'Fraunces',serif; font-size:22px; font-weight:700; text-align:center; margin:4px 0 16px; }
  .order-popup-body{ background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:8px; }
  .order-popup-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink); padding:3px 0; }
  .order-popup-row-total{ border-top:1px dashed var(--ink); margin-top:6px; padding-top:6px; font-weight:700; }
  .order-popup-cust{ color:#5C574C; font-size:12px; margin:8px 0 16px; text-align:center; }
  .order-popup-btns{ display:flex; gap:10px; }
  .order-popup-btns .btn-primary{ flex:1; padding:14px; border:none; border-radius:10px; background:var(--leaf); color:var(--cloud); font-weight:600; font-size:15px; cursor:pointer; font-family:'Inter',sans-serif; }
  .order-popup-btns .btn-danger{ flex:1; padding:14px; border-radius:10px; background:transparent; border:1.5px solid var(--chili); color:var(--chili); font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }
</style>
</head>
<body>
<div id="app">

  <div class="toast" id="toast"></div>

  <div class="order-popup-overlay" id="order-popup-overlay">
    <div class="order-popup">
      <div class="order-popup-ring">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F7F3EA" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <p class="order-popup-eyebrow" id="popup-eyebrow">NEW ORDER</p>
      <div class="order-popup-list" id="popup-list"></div>
    </div>
  </div>

  <!-- ORDER LIST -->
  <section class="screen active" id="screen-list">
    <div class="top-row">
      <button class="btn-back" onclick="window.location.href='index.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <p class="eyebrow">ORDERS</p>
        <h1 class="title">Your Orders</h1>
      </div>
    </div>
    <div class="order-list" id="order-list"></div>
  </section>

  <!-- ORDER DETAIL -->
  <section class="screen" id="screen-detail">
    <div class="top-row">
      <button class="btn-back" onclick="showScreen('list')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <p class="eyebrow" id="detail-order-num">ORDER</p>
        <h1 class="title" id="detail-status-title">Details</h1>
      </div>
    </div>

    <div class="detail-block">
      <p class="detail-label">Customer</p>
      <p class="detail-value" id="detail-cust-name"></p>
      <p class="detail-label">Phone</p>
      <a class="detail-value detail-phone-link" id="detail-cust-phone" href="tel:"></a>
      <p class="detail-label">Delivery address</p>
      <p class="detail-value" id="detail-cust-address"></p>
      <p class="detail-label" id="detail-landmark-label" style="display:none;">Landmark</p>
      <p class="detail-value" id="detail-cust-landmark" style="display:none;"></p>
      <button class="detail-map-btn" id="detail-map-btn" style="display:none;">📍 Open location on map</button>
    </div>

    <div class="detail-block">
      <p class="detail-label">Items</p>
      <div id="detail-items"></div>
      <div class="item-row item-row-total">
        <span>Total</span>
        <span id="detail-total"></span>
      </div>
    </div>

    <div class="status-actions" id="status-actions"></div>
  </section>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCrM5wKwsnGtIc7HSTk_5R1d3dXEcYyd7o",
    authDomain: "texi-and-food.firebaseapp.com",
    databaseURL: "https://texi-and-food-default-rtdb.firebaseio.com",
    projectId: "texi-and-food",
    storageBucket: "texi-and-food.firebasestorage.app",
    messagingSenderId: "98800730432",
    appId: "1:98800730432:web:9d7651e792c60baafabaa5"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);
  window.fb = { db, ref, onValue, update };
  window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
let restId = localStorage.getItem('asfood_partner_id');
let orders = [];
let selectedOrderId = null;
let pendingOpenId = new URLSearchParams(window.location.search).get('order');

if (!restId) {
  window.location.href = 'index.html';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

const alarmAudio = new Audio('Boat_Alarm_Alert.mp3');
alarmAudio.loop = true;

// ---------- Audio unlock ----------
// Same audio-unlock trick as index.html — primes playback on the first tap
// on this page so a later, tap-less startRinging() call (from the Firebase
// listener) is allowed to actually produce sound.
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  alarmAudio.play().then(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; }).catch(() => {
    audioUnlocked = false;
  });
}
document.addEventListener('click', unlockAudio, { capture: true });
document.addEventListener('touchstart', unlockAudio, { capture: true });

let vibrateInterval = null;
function startRinging() {
  stopRinging();
  alarmAudio.currentTime = 0;
  alarmAudio.play().catch(() => {});
  if (navigator.vibrate) {
    navigator.vibrate([500, 300, 500, 300, 500]);
    vibrateInterval = setInterval(() => navigator.vibrate([500, 300, 500, 300, 500]), 2000);
  }
}
function stopRinging() {
  alarmAudio.pause();
  alarmAudio.currentTime = 0;
  if (vibrateInterval) { clearInterval(vibrateInterval); vibrateInterval = null; }
  if (navigator.vibrate) navigator.vibrate(0);
}

// Renders every currently-pending order together in one popup, each with
// its own Accept/Reject buttons. The popup only closes once ALL pending
// orders have been actioned (an individual card just drops out of the
// list the moment its order is accepted or rejected).
function renderOrderPopup(pendingList) {
  const overlay = document.getElementById('order-popup-overlay');
  const listEl = document.getElementById('popup-list');
  const eyebrow = document.getElementById('popup-eyebrow');

  if (!pendingList.length) {
    overlay.classList.remove('show');
    stopRinging();
    listEl.innerHTML = "";
    return;
  }

  eyebrow.textContent = pendingList.length > 1 ? `NEW ORDERS (${pendingList.length})` : "NEW ORDER";

  listEl.innerHTML = "";
  pendingList.forEach(order => {
    const card = document.createElement('div');
    card.className = "order-popup-card";

    const itemsHtml = (order.items || []).map(it =>
      `<div class="order-popup-row"><span>${it.qty} × ${it.name}</span><span>₹${it.price * it.qty}</span></div>`
    ).join('');

    card.innerHTML = `
      <h2 class="order-popup-title">${order.orderNumber || 'New order'}</h2>
      <div class="order-popup-body">
        ${itemsHtml}
        <div class="order-popup-row order-popup-row-total"><span>Total</span><span>₹${order.total || 0}</span></div>
      </div>
      <p class="order-popup-cust" data-cust></p>
      <div class="order-popup-btns">
        <button class="btn-danger" data-action="reject" data-id="${order.id}">Reject</button>
        <button class="btn-primary" data-action="accept" data-id="${order.id}">Accept order</button>
      </div>
    `;

    // Build customer line (with clickable phone link) safely via DOM, same as before.
    const custEl = card.querySelector('[data-cust]');
    const custBits = [order.customerName || 'Guest', order.customerAddress, order.customerLandmark].filter(Boolean);
    custEl.append(custBits.join(" · "));
    if (order.customerPhone) {
      const sep = document.createTextNode(" · ");
      const phoneLink = document.createElement('a');
      phoneLink.href = "tel:" + order.customerPhone;
      phoneLink.textContent = order.customerPhone;
      phoneLink.style.color = "var(--leaf)";
      phoneLink.style.fontWeight = "700";
      phoneLink.style.textDecoration = "none";
      custEl.append(sep, phoneLink);
    }

    listEl.appendChild(card);
  });

  listEl.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => handlePopupOrderAction(btn.dataset.id, btn.dataset.action);
  });

  overlay.classList.add('show');
  startRinging();
}

async function handlePopupOrderAction(orderId, action) {
  const newStatus = action === 'accept' ? 'preparing' : 'rejected';
  try {
    const { db, ref, update } = window.fb;
    await update(ref(db, 'restaurants/' + restId + '/orders/' + orderId), { status: newStatus });
  } catch (e) {}
  showToast(action === 'accept' ? "Order accepted" : "Order rejected");
  // The onValue listener below will fire again and re-render the popup
  // without this order — no manual DOM removal needed here.
}

function timeAgo(ts) {
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + " min ago";
  if (diff < 86400) return Math.floor(diff / 3600) + " hr ago";
  return new Date(ts).toLocaleDateString();
}

function pillClass(status) {
  return "pill pill-" + (status || "pending");
}

// Builds a Google Maps link that opens directly at the customer's correct
// pinned location. Prefers exact lat/lng saved with the order; falls back
// to parsing a "lat, lng" string, then to a text search as a last resort.
function buildMapUrl(o) {
  if (typeof o.customerLat === 'number' && typeof o.customerLng === 'number') {
    return `https://www.google.com/maps/search/?api=1&query=${o.customerLat},${o.customerLng}`;
  }
  if (o.customerLocation) {
    const m = String(o.customerLocation).trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if (m) return `https://www.google.com/maps/search/?api=1&query=${m[1]},${m[2]}`;
  }
  const addr = [o.customerAddress, o.customerLocation].filter(Boolean).join(', ');
  if (addr) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
  return null;
}

window.addEventListener('fb-ready', () => {
  const { db, ref, onValue } = window.fb;
  onValue(ref(db, 'restaurants/' + restId + '/orders'), snap => {
    const list = [];
    snap.forEach(child => {
      list.push({ id: child.key, ...child.val() });
    });
    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    orders = list;
    renderList();

    if (pendingOpenId) {
      const target = pendingOpenId;
      pendingOpenId = null;
      if (list.some(o => o.id === target)) openDetail(target);
    }

    // Always reflects the full set of currently-pending orders, so all of
    // them show together in one popup instead of queuing one after another.
    const pendingOrders = list
      .filter(o => (o.status || 'pending') === 'pending')
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    renderOrderPopup(pendingOrders);

    if (selectedOrderId) {
      const updated = list.find(o => o.id === selectedOrderId);
      if (updated) renderDetail(updated);
    }
  });
});

function renderList() {
  const el = document.getElementById('order-list');
  el.innerHTML = "";
  if (orders.length === 0) {
    const p = document.createElement('p');
    p.className = "empty-text";
    p.textContent = "No orders yet. New orders from customers will show up here.";
    el.appendChild(p);
    return;
  }
  orders.forEach(o => {
    const itemCount = (o.items || []).reduce((s, it) => s + (it.qty || 0), 0);
    const btn = document.createElement('button');
    btn.className = "chit";
    btn.innerHTML = `
      <div class="order-top">
        <p class="order-num">${o.orderNumber || o.id}</p>
        <span class="${pillClass(o.status)}">${o.status || 'pending'}</span>
      </div>
      <p class="order-time">${timeAgo(o.createdAt || Date.now())} · ${itemCount} item${itemCount === 1 ? '' : 's'}</p>
      <div class="order-mid">
        <p class="order-cust">${o.customerName || 'Guest'}</p>
        <p class="order-total">₹${o.total || 0}</p>
      </div>
    `;
    btn.addEventListener('click', () => openDetail(o.id));
    el.appendChild(btn);
  });
}

function openDetail(id) {
  selectedOrderId = id;
  const o = orders.find(x => x.id === id);
  if (!o) return;
  renderDetail(o);
  showScreen('detail');
}

function renderDetail(o) {
  document.getElementById('detail-order-num').textContent = o.orderNumber || o.id;
  document.getElementById('detail-status-title').textContent = (o.status || 'pending').charAt(0).toUpperCase() + (o.status || 'pending').slice(1);
  document.getElementById('detail-cust-name').textContent = o.customerName || 'Guest';
  const phoneLink = document.getElementById('detail-cust-phone');
  if (o.customerPhone) {
    phoneLink.textContent = o.customerPhone;
    phoneLink.href = "tel:" + o.customerPhone;
  } else {
    phoneLink.textContent = '—';
    phoneLink.removeAttribute('href');
  }
  document.getElementById('detail-cust-address').textContent = [o.customerAddress, o.customerLocation].filter(Boolean).join(', ') || '—';

  const landmarkLabel = document.getElementById('detail-landmark-label');
  const landmarkValue = document.getElementById('detail-cust-landmark');
  if (o.customerLandmark) {
    landmarkLabel.style.display = "block";
    landmarkValue.style.display = "block";
    landmarkValue.textContent = o.customerLandmark;
  } else {
    landmarkLabel.style.display = "none";
    landmarkValue.style.display = "none";
  }

  const mapBtn = document.getElementById('detail-map-btn');
  const mapUrl = buildMapUrl(o);
  if (mapUrl) {
    mapBtn.style.display = "inline-flex";
    mapBtn.onclick = () => window.open(mapUrl, '_blank');
  } else {
    mapBtn.style.display = "none";
    mapBtn.onclick = null;
  }

  const itemsEl = document.getElementById('detail-items');
  itemsEl.innerHTML = "";
  (o.items || []).forEach(it => {
    const row = document.createElement('div');
    row.className = "item-row";
    row.innerHTML = `<span>${it.qty} × ${it.name}</span><span>₹${it.price * it.qty}</span>`;
    itemsEl.appendChild(row);
  });
  document.getElementById('detail-total').textContent = "₹" + (o.total || 0);

  const actionsEl = document.getElementById('status-actions');
  actionsEl.innerHTML = "";
  const status = o.status || 'pending';
  const buttons = [];
  if (status === 'pending') buttons.push({ label: 'Accept & start preparing', cls: 'preparing', next: 'preparing' });
  if (status === 'preparing') buttons.push({ label: 'Mark as ready', cls: 'ready', next: 'ready' });
  if (status === 'ready') buttons.push({ label: 'Mark as delivered', cls: 'delivered', next: 'delivered' });
  if (status !== 'delivered' && status !== 'cancelled') buttons.push({ label: 'Cancel order', cls: 'cancel', next: 'cancelled' });

  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = "status-btn " + b.cls;
    btn.textContent = b.label;
    btn.addEventListener('click', () => updateStatus(o.id, b.next));
    actionsEl.appendChild(btn);
  });
}

async function updateStatus(id, newStatus) {
  try {
    const { db, ref, update } = window.fb;
    await update(ref(db, 'restaurants/' + restId + '/orders/' + id), { status: newStatus });
    showToast("Order marked as " + newStatus);
  } catch (e) {
    alert("Couldn't update order — check your connection and try again.");
  }
}
</script>
</body>
</html>
